<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 使用流程</title>
  <desc id="desc">从进入项目、启动 Claude Code、提供上下文，到计划、执行、验证和沉淀记忆的流程图。</desc>
  <rect width="980" height="420" fill="#f7fafc"/>
  <text x="490" y="42" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#1f2937">Claude Code 日常使用闭环</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#1f2937">
    <rect x="54" y="95" width="140" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="124" y="127" text-anchor="middle" font-weight="700">进入项目</text>
    <text x="124" y="153" text-anchor="middle">cd repo</text>
    <rect x="242" y="95" width="140" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="312" y="127" text-anchor="middle" font-weight="700">启动会话</text>
    <text x="312" y="153" text-anchor="middle">claude</text>
    <rect x="430" y="95" width="140" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="127" text-anchor="middle" font-weight="700">给上下文</text>
    <text x="500" y="153" text-anchor="middle">目标/文件/约束</text>
    <rect x="618" y="95" width="140" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="688" y="127" text-anchor="middle" font-weight="700">先计划</text>
    <text x="688" y="153" text-anchor="middle">/plan 或说明</text>
    <rect x="806" y="95" width="140" height="78" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="876" y="127" text-anchor="middle" font-weight="700">小步执行</text>
    <text x="876" y="153" text-anchor="middle">改文件/跑命令</text>
    <rect x="240" y="255" width="155" height="82" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="318" y="288" text-anchor="middle" font-weight="700">看 diff</text>
    <text x="318" y="314" text-anchor="middle">确认改动边界</text>
    <rect x="442" y="255" width="155" height="82" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="520" y="288" text-anchor="middle" font-weight="700">验证结果</text>
    <text x="520" y="314" text-anchor="middle">测试/构建/手测</text>
    <rect x="644" y="255" width="155" height="82" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="722" y="288" text-anchor="middle" font-weight="700">沉淀规则</text>
    <text x="722" y="314" text-anchor="middle">CLAUDE.md/Skill</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M194 134H242"/>
    <path d="M382 134H430"/>
    <path d="M570 134H618"/>
    <path d="M758 134H806"/>
    <path d="M876 173C876 225 800 232 760 255"/>
    <path d="M644 296H597"/>
    <path d="M442 296H395"/>
    <path d="M318 255C292 214 331 190 430 159"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
