<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
  <title id="title">Codex提高软件编程效率的10个技巧总览</title>
  <desc id="desc">围绕准备、委派、验证和沉淀四个阶段组织Codex使用技巧。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#315f9c"/>
    </marker>
    <style>
      .bg{fill:#f6f9ff}
      .stage{fill:#eaf2ff;stroke:#8fb4e6;stroke-width:2;rx:14}
      .tip{fill:#fff;stroke:#7aa3da;stroke-width:1.8;rx:10}
      .title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17345f}
      .stageText{font:700 20px Arial,"Microsoft YaHei",sans-serif;fill:#17345f}
      .label{font:700 16px Arial,"Microsoft YaHei",sans-serif;fill:#17345f}
      .note{font:13px Arial,"Microsoft YaHei",sans-serif;fill:#4e6380}
      .arrow{fill:none;stroke:#315f9c;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1080" height="680" rx="18"/>
  <text class="title" x="540" y="48" text-anchor="middle">Codex提高软件编程效率的10个技巧</text>

  <rect class="stage" x="50" y="92" width="220" height="500"/>
  <text class="stageText" x="160" y="128" text-anchor="middle">准备</text>
  <rect class="tip" x="75" y="160" width="170" height="66"/>
  <text class="label" x="160" y="185" text-anchor="middle">1. 任务写成issue</text>
  <text class="note" x="160" y="207" text-anchor="middle">目标、边界、验收</text>
  <rect class="tip" x="75" y="250" width="170" height="66"/>
  <text class="label" x="160" y="275" text-anchor="middle">2. 写AGENTS.md</text>
  <text class="note" x="160" y="297" text-anchor="middle">规则、命令、风格</text>
  <rect class="tip" x="75" y="340" width="170" height="66"/>
  <text class="label" x="160" y="365" text-anchor="middle">3. 配好环境</text>
  <text class="note" x="160" y="387" text-anchor="middle">依赖、测试、脚本</text>

  <rect class="stage" x="305" y="92" width="220" height="500"/>
  <text class="stageText" x="415" y="128" text-anchor="middle">委派</text>
  <rect class="tip" x="330" y="160" width="170" height="66"/>
  <text class="label" x="415" y="185" text-anchor="middle">4. 先要计划</text>
  <text class="note" x="415" y="207" text-anchor="middle">让Codex先解释路径</text>
  <rect class="tip" x="330" y="250" width="170" height="66"/>
  <text class="label" x="415" y="275" text-anchor="middle">5. 小步改动</text>
  <text class="note" x="415" y="297" text-anchor="middle">一个任务一个焦点</text>
  <rect class="tip" x="330" y="340" width="170" height="66"/>
  <text class="label" x="415" y="365" text-anchor="middle">6. 并行探索</text>
  <text class="note" x="415" y="387" text-anchor="middle">主线与子任务分开</text>

  <rect class="stage" x="560" y="92" width="220" height="500"/>
  <text class="stageText" x="670" y="128" text-anchor="middle">验证</text>
  <rect class="tip" x="585" y="160" width="170" height="66"/>
  <text class="label" x="670" y="185" text-anchor="middle">7. 强制跑测试</text>
  <text class="note" x="670" y="207" text-anchor="middle">构建、单测、类型</text>
  <rect class="tip" x="585" y="250" width="170" height="66"/>
  <text class="label" x="670" y="275" text-anchor="middle">8. 用/review复查</text>
  <text class="note" x="670" y="297" text-anchor="middle">找bug和边界</text>
  <rect class="tip" x="585" y="340" width="170" height="66"/>
  <text class="label" x="670" y="365" text-anchor="middle">9. 控制权限</text>
  <text class="note" x="670" y="387" text-anchor="middle">沙箱、审批、最小化</text>

  <rect class="stage" x="815" y="92" width="220" height="500"/>
  <text class="stageText" x="925" y="128" text-anchor="middle">沉淀</text>
  <rect class="tip" x="840" y="220" width="170" height="86"/>
  <text class="label" x="925" y="250" text-anchor="middle">10. 复盘成模板</text>
  <text class="note" x="925" y="274" text-anchor="middle">提示词、检查清单</text>
  <text class="note" x="925" y="294" text-anchor="middle">规则和自动化</text>
  <rect class="tip" x="840" y="350" width="170" height="86"/>
  <text class="label" x="925" y="380" text-anchor="middle">持续改进</text>
  <text class="note" x="925" y="404" text-anchor="middle">把经验写回项目</text>
  <text class="note" x="925" y="424" text-anchor="middle">下一次更快</text>

  <path class="arrow" d="M270 342 H295"/>
  <path class="arrow" d="M525 342 H550"/>
  <path class="arrow" d="M780 342 H805"/>
  <text class="note" x="540" y="632" text-anchor="middle">效率来自闭环：准备越充分，委派越清楚，验证越真实，沉淀越复利。</text>
</svg>
