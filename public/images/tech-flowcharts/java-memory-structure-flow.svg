<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Java 运行时内存结构</title>
  <desc id="desc">展示线程私有区域、线程共享区域以及对象分配和方法调用的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f5d7c"/></marker>
    <style>
      .box{fill:#f7fbff;stroke:#2f5d7c;stroke-width:2;rx:10;ry:10}
      .key{fill:#eef7f0;stroke:#347a44;stroke-width:2;rx:10;ry:10}
      .warn{fill:#fff8e8;stroke:#9a6a16;stroke-width:2;rx:10;ry:10}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:17px;fill:#1f2d3d}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;fill:#4d5b68}
      .line{stroke:#2f5d7c;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="980" height="560" fill="#fff"/>
  <text x="490" y="42" text-anchor="middle" class="text" font-size="26">Java 内存结构与供应链库存请求</text>
  <rect x="55" y="90" width="390" height="380" class="box"/>
  <text x="250" y="122" text-anchor="middle" class="text">线程私有</text>
  <rect x="95" y="155" width="130" height="70" class="key"/>
  <text x="160" y="184" text-anchor="middle" class="text">程序计数器</text>
  <text x="160" y="207" text-anchor="middle" class="small">执行位置</text>
  <rect x="275" y="155" width="130" height="70" class="key"/>
  <text x="340" y="184" text-anchor="middle" class="text">虚拟机栈</text>
  <text x="340" y="207" text-anchor="middle" class="small">栈帧 局部变量</text>
  <rect x="95" y="275" width="130" height="70" class="warn"/>
  <text x="160" y="304" text-anchor="middle" class="text">本地方法栈</text>
  <text x="160" y="327" text-anchor="middle" class="small">JNI Native</text>
  <rect x="275" y="275" width="130" height="70" class="warn"/>
  <text x="340" y="304" text-anchor="middle" class="text">线程栈大小</text>
  <text x="340" y="327" text-anchor="middle" class="small">-Xss</text>
  <rect x="535" y="90" width="390" height="380" class="box"/>
  <text x="730" y="122" text-anchor="middle" class="text">线程共享</text>
  <rect x="575" y="155" width="140" height="82" class="key"/>
  <text x="645" y="188" text-anchor="middle" class="text">堆</text>
  <text x="645" y="212" text-anchor="middle" class="small">订单 库存对象</text>
  <rect x="755" y="155" width="130" height="82" class="key"/>
  <text x="820" y="188" text-anchor="middle" class="text">元空间</text>
  <text x="820" y="212" text-anchor="middle" class="small">类信息</text>
  <rect x="575" y="295" width="140" height="82" class="warn"/>
  <text x="645" y="328" text-anchor="middle" class="text">直接内存</text>
  <text x="645" y="352" text-anchor="middle" class="small">NIO Buffer</text>
  <rect x="755" y="295" width="130" height="82" class="warn"/>
  <text x="820" y="328" text-anchor="middle" class="text">代码缓存</text>
  <text x="820" y="352" text-anchor="middle" class="small">JIT 编译代码</text>
  <rect x="340" y="500" width="300" height="42" class="box"/>
  <text x="490" y="526" text-anchor="middle" class="small">请求线程执行方法，局部变量在栈，对象实例在堆，类元数据在元空间</text>
  <path class="line" d="M405 190 H575"/>
  <path class="line" d="M405 310 H575"/>
</svg>
