<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">并发集合和线程排查流程</title>
  <desc id="desc">供应链仓储任务中并发集合选择和线程卡顿排查流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .ok { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #111827; }
      .sub { font-size: 13px; fill: #4b5563; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="40" y="70" width="165" height="70" class="box"/>
  <text x="122" y="100" text-anchor="middle" class="text">并发数据结构</text>
  <text x="122" y="122" text-anchor="middle" class="sub">按访问模式选择</text>
  <path d="M 205 105 H 285" class="line"/>
  <rect x="300" y="35" width="180" height="65" class="ok"/>
  <text x="390" y="62" text-anchor="middle" class="text">ConcurrentHashMap</text>
  <text x="390" y="84" text-anchor="middle" class="sub">本地任务注册</text>
  <rect x="300" y="120" width="180" height="65" class="ok"/>
  <text x="390" y="147" text-anchor="middle" class="text">BlockingQueue</text>
  <text x="390" y="169" text-anchor="middle" class="sub">生产者消费者</text>
  <rect x="520" y="35" width="180" height="65" class="ok"/>
  <text x="610" y="62" text-anchor="middle" class="text">CopyOnWriteArrayList</text>
  <text x="610" y="84" text-anchor="middle" class="sub">读多写少规则</text>
  <rect x="520" y="120" width="180" height="65" class="ok"/>
  <text x="610" y="147" text-anchor="middle" class="text">AtomicReference</text>
  <text x="610" y="169" text-anchor="middle" class="sub">快照整体替换</text>
  <rect x="110" y="275" width="160" height="70" class="warn"/>
  <text x="190" y="304" text-anchor="middle" class="text">线上卡顿</text>
  <text x="190" y="326" text-anchor="middle" class="sub">先保留现场</text>
  <path d="M 270 310 H 350" class="line"/>
  <rect x="365" y="275" width="160" height="70" class="box"/>
  <text x="445" y="304" text-anchor="middle" class="text">线程状态</text>
  <text x="445" y="326" text-anchor="middle" class="sub">jstack / Arthas</text>
  <path d="M 525 310 H 605" class="line"/>
  <rect x="620" y="275" width="160" height="70" class="box"/>
  <text x="700" y="304" text-anchor="middle" class="text">锁和队列</text>
  <text x="700" y="326" text-anchor="middle" class="sub">BLOCKED / WAITING</text>
  <path d="M 780 310 H 860" class="line"/>
  <rect x="875" y="275" width="85" height="70" class="warn"/>
  <text x="917" y="304" text-anchor="middle" class="text">业务根因</text>
  <text x="917" y="326" text-anchor="middle" class="sub">状态机</text>
</svg>
