<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">MySQL 锁设计流程</title>
  <desc id="desc">供应链系统中根据业务事实、索引、事务范围和状态条件设计 MySQL 锁。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e40af"/>
    </marker>
    <style>
      .box { fill: #eff6ff; stroke: #1e40af; stroke-width: 2; rx: 8; }
      .ok { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #172554; }
      .sub { font-size: 13px; fill: #475569; }
      .line { stroke: #1e40af; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="45" y="170" width="150" height="75" class="box"/>
  <text x="120" y="200" text-anchor="middle" class="text">业务事实</text>
  <text x="120" y="224" text-anchor="middle" class="sub">库存、单据、批次</text>
  <path d="M 195 208 H 280" class="line"/>
  <rect x="295" y="170" width="160" height="75" class="box"/>
  <text x="375" y="200" text-anchor="middle" class="text">唯一索引</text>
  <text x="375" y="224" text-anchor="middle" class="sub">定位锁范围</text>
  <path d="M 455 208 H 540" class="line"/>
  <rect x="555" y="170" width="160" height="75" class="ok"/>
  <text x="635" y="200" text-anchor="middle" class="text">条件更新</text>
  <text x="635" y="224" text-anchor="middle" class="sub">判断 + 修改</text>
  <path d="M 715 208 H 800" class="line"/>
  <rect x="815" y="170" width="125" height="75" class="ok"/>
  <text x="877" y="200" text-anchor="middle" class="text">事务提交</text>
  <text x="877" y="224" text-anchor="middle" class="sub">锁释放</text>
  <rect x="295" y="300" width="420" height="65" class="warn"/>
  <text x="505" y="327" text-anchor="middle" class="text">事务范围必须短</text>
  <text x="505" y="349" text-anchor="middle" class="sub">不要在持锁期间调用远程接口、等待用户、生成大报表</text>
</svg>
