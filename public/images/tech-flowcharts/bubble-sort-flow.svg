<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">冒泡排序流程</title>
  <desc id="desc">相邻元素比较并交换，每一轮把当前最大值移动到末尾。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c2d12"/>
    </marker>
    <style>
      .box { fill: #fff7ed; stroke: #7c2d12; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #431407; }
      .sub { font-size: 14px; fill: #7c2d12; }
      .line { stroke: #7c2d12; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="50" y="85" width="150" height="75" class="box"/>
  <text x="125" y="115" text-anchor="middle" class="text">开始一轮</text>
  <text x="125" y="140" text-anchor="middle" class="sub">未排序区间</text>
  <path d="M 200 122 H 285" class="line"/>
  <rect x="300" y="85" width="150" height="75" class="box"/>
  <text x="375" y="115" text-anchor="middle" class="text">相邻比较</text>
  <text x="375" y="140" text-anchor="middle" class="sub">arr[j] 和 arr[j+1]</text>
  <path d="M 450 122 H 535" class="line"/>
  <rect x="550" y="85" width="150" height="75" class="box"/>
  <text x="625" y="115" text-anchor="middle" class="text">必要时交换</text>
  <text x="625" y="140" text-anchor="middle" class="sub">较大值向右移动</text>
  <path d="M 625 160 C 630 220, 350 230, 375 160" class="line"/>
  <path d="M 700 122 H 775" class="line"/>
  <rect x="790" y="85" width="80" height="75" class="box"/>
  <text x="830" y="115" text-anchor="middle" class="text">收缩</text>
  <text x="830" y="140" text-anchor="middle" class="sub">最大值归位</text>
  <rect x="240" y="245" width="420" height="55" class="box"/>
  <text x="450" y="270" text-anchor="middle" class="text">如果整轮没有交换，说明已经有序，可以提前结束</text>
</svg>
