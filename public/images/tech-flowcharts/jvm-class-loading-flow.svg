<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">JVM 类加载与执行流程</title>
  <desc id="desc">展示 Java 源码编译成字节码后，经类加载、验证、准备、解析、初始化进入运行时执行的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d7c"/>
    </marker>
    <style>
      .box{fill:#f7fbff;stroke:#2f5d7c;stroke-width:2;rx:10;ry:10}
      .key{fill:#eef7f0;stroke:#347a44;stroke-width:2;rx:10;ry:10}
      .warn{fill:#fff8e8;stroke:#9a6a16;stroke-width:2;rx:10;ry:10}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:17px;fill:#1f2d3d}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;fill:#4d5b68}
      .line{stroke:#2f5d7c;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="42" text-anchor="middle" class="text" font-size="26">供应链订单服务的 JVM 加载执行链路</text>
  <rect x="55" y="90" width="160" height="74" class="box"/>
  <text x="135" y="120" text-anchor="middle" class="text">Java 源码</text>
  <text x="135" y="145" text-anchor="middle" class="small">OrderService.java</text>
  <rect x="270" y="90" width="160" height="74" class="box"/>
  <text x="350" y="120" text-anchor="middle" class="text">字节码</text>
  <text x="350" y="145" text-anchor="middle" class="small">.class / jar</text>
  <rect x="485" y="90" width="180" height="74" class="key"/>
  <text x="575" y="120" text-anchor="middle" class="text">类加载器</text>
  <text x="575" y="145" text-anchor="middle" class="small">双亲委派</text>
  <rect x="720" y="90" width="190" height="74" class="key"/>
  <text x="815" y="120" text-anchor="middle" class="text">运行时数据区</text>
  <text x="815" y="145" text-anchor="middle" class="small">堆 栈 元空间</text>
  <rect x="85" y="245" width="150" height="70" class="box"/>
  <text x="160" y="274" text-anchor="middle" class="text">加载</text>
  <text x="160" y="297" text-anchor="middle" class="small">读取 class</text>
  <rect x="275" y="245" width="150" height="70" class="warn"/>
  <text x="350" y="274" text-anchor="middle" class="text">验证</text>
  <text x="350" y="297" text-anchor="middle" class="small">安全与格式</text>
  <rect x="465" y="245" width="150" height="70" class="box"/>
  <text x="540" y="274" text-anchor="middle" class="text">准备</text>
  <text x="540" y="297" text-anchor="middle" class="small">静态字段默认值</text>
  <rect x="655" y="245" width="150" height="70" class="box"/>
  <text x="730" y="274" text-anchor="middle" class="text">解析</text>
  <text x="730" y="297" text-anchor="middle" class="small">符号引用转直接引用</text>
  <rect x="415" y="390" width="180" height="76" class="key"/>
  <text x="505" y="422" text-anchor="middle" class="text">初始化与执行</text>
  <text x="505" y="447" text-anchor="middle" class="small">static 初始化 JIT 优化</text>
  <path class="line" d="M215 127 H270"/>
  <path class="line" d="M430 127 H485"/>
  <path class="line" d="M665 127 H720"/>
  <path class="line" d="M160 164 V245"/>
  <path class="line" d="M235 280 H275"/>
  <path class="line" d="M425 280 H465"/>
  <path class="line" d="M615 280 H655"/>
  <path class="line" d="M730 315 C730 365 595 365 540 390"/>
</svg>
