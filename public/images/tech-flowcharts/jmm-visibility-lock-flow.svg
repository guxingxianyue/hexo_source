<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">JMM 可见性和锁边界流程</title>
  <desc id="desc">Java 内存模型中 volatile、synchronized 和数据库锁的适用边界。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; }
      .java { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 8; }
      .db { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #111827; }
      .sub { font-size: 13px; fill: #4b5563; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="45" y="160" width="160" height="80" class="box"/>
  <text x="125" y="192" text-anchor="middle" class="text">并发问题</text>
  <text x="125" y="216" text-anchor="middle" class="sub">原子性、可见性、有序性</text>
  <path d="M 205 200 H 285" class="line"/>
  <rect x="300" y="55" width="180" height="85" class="java"/>
  <text x="390" y="88" text-anchor="middle" class="text">volatile</text>
  <text x="390" y="112" text-anchor="middle" class="sub">状态标志、快照引用</text>
  <rect x="300" y="160" width="180" height="85" class="java"/>
  <text x="390" y="193" text-anchor="middle" class="text">synchronized</text>
  <text x="390" y="217" text-anchor="middle" class="sub">单 JVM 内互斥</text>
  <rect x="300" y="265" width="180" height="85" class="db"/>
  <text x="390" y="298" text-anchor="middle" class="text">数据库锁</text>
  <text x="390" y="322" text-anchor="middle" class="sub">跨实例业务一致性</text>
  <path d="M 480 98 H 575" class="line"/>
  <path d="M 480 203 H 575" class="line"/>
  <path d="M 480 308 H 575" class="line"/>
  <rect x="590" y="55" width="300" height="85" class="box"/>
  <text x="740" y="88" text-anchor="middle" class="text">库存同步停止标志</text>
  <text x="740" y="112" text-anchor="middle" class="sub">保证管理线程写入对工作线程可见</text>
  <rect x="590" y="160" width="300" height="85" class="box"/>
  <text x="740" y="193" text-anchor="middle" class="text">本地缓存 Map</text>
  <text x="740" y="217" text-anchor="middle" class="sub">保护当前进程内共享对象</text>
  <rect x="590" y="265" width="300" height="85" class="box"/>
  <text x="740" y="298" text-anchor="middle" class="text">库存扣减</text>
  <text x="740" y="322" text-anchor="middle" class="sub">条件更新、事务、行锁保护最终事实</text>
</svg>
