<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Hexo 博客发布流程</title>
  <desc id="desc">从 Markdown 写作到 Hexo 生成，再部署到 GitHub Pages 的流程图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d62"/>
    </marker>
    <style>
      .box { fill: #f7fbfa; stroke: #2f5d62; stroke-width: 2; rx: 8; }
      .accent { fill: #e7f1ef; stroke: #2f5d62; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #19383b; }
      .sub { font-size: 14px; fill: #53676a; }
      .line { stroke: #2f5d62; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="40" y="80" width="160" height="90" class="box"/>
  <text x="120" y="116" text-anchor="middle" class="text">Markdown 文章</text>
  <text x="120" y="142" text-anchor="middle" class="sub">source/_posts</text>
  <path d="M 200 125 H 285" class="line"/>
  <rect x="300" y="80" width="160" height="90" class="accent"/>
  <text x="380" y="116" text-anchor="middle" class="text">Hexo 生成</text>
  <text x="380" y="142" text-anchor="middle" class="sub">npm run generate</text>
  <path d="M 460 125 H 545" class="line"/>
  <rect x="560" y="80" width="160" height="90" class="box"/>
  <text x="640" y="116" text-anchor="middle" class="text">静态文件</text>
  <text x="640" y="142" text-anchor="middle" class="sub">public/</text>
  <path d="M 720 125 H 805" class="line"/>
  <rect x="820" y="80" width="100" height="90" class="accent"/>
  <text x="870" y="116" text-anchor="middle" class="text">部署</text>
  <text x="870" y="142" text-anchor="middle" class="sub">GitHub Pages</text>
  <rect x="170" y="240" width="620" height="70" class="box"/>
  <text x="480" y="270" text-anchor="middle" class="text">维护闭环：写作 -> 本地预览 -> 构建校验 -> 提交源码 -> 部署验证</text>
  <text x="480" y="294" text-anchor="middle" class="sub">文章、流程图、标签和站点配置都应该进入源码仓库管理</text>
</svg>
