<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">MySQL 死锁和锁等待排查流程</title>
  <desc id="desc">从现象、InnoDB 状态、锁等待表、SQL 和业务加锁顺序定位 MySQL 死锁。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#991b1b"/>
    </marker>
    <style>
      .box { fill: #fef2f2; stroke: #991b1b; stroke-width: 2; rx: 8; }
      .fix { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #7f1d1d; }
      .sub { font-size: 13px; fill: #4b5563; }
      .line { stroke: #991b1b; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="40" y="165" width="150" height="75" class="box"/>
  <text x="115" y="196" text-anchor="middle" class="text">锁等待/死锁</text>
  <text x="115" y="220" text-anchor="middle" class="sub">接口超时、事务回滚</text>
  <path d="M 190 202 H 275" class="line"/>
  <rect x="290" y="165" width="170" height="75" class="box"/>
  <text x="375" y="196" text-anchor="middle" class="text">SHOW ENGINE</text>
  <text x="375" y="220" text-anchor="middle" class="sub">LATEST DEADLOCK</text>
  <path d="M 460 202 H 545" class="line"/>
  <rect x="560" y="165" width="170" height="75" class="box"/>
  <text x="645" y="196" text-anchor="middle" class="text">锁等待表</text>
  <text x="645" y="220" text-anchor="middle" class="sub">data_locks / waits</text>
  <path d="M 730 202 H 815" class="line"/>
  <rect x="830" y="165" width="110" height="75" class="box"/>
  <text x="885" y="196" text-anchor="middle" class="text">定位 SQL</text>
  <text x="885" y="220" text-anchor="middle" class="sub">索引和顺序</text>
  <rect x="250" y="305" width="480" height="65" class="fix"/>
  <text x="490" y="332" text-anchor="middle" class="text">修复方向</text>
  <text x="490" y="354" text-anchor="middle" class="sub">固定加锁顺序、缩短事务、补索引、有限重试、移出远程调用</text>
</svg>
