<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">ERP 报表统计优化流程</title>
  <desc id="desc">展示 ERP 报表从口径定义、数据同步、宽表汇总到展示下钻的优化链路。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#315a78"/>
    </marker>
    <style>
      .box{fill:#f7fbff;stroke:#315a78;stroke-width:2;rx:10;ry:10}
      .key{fill:#eef7f0;stroke:#347a44;stroke-width:2;rx:10;ry:10}
      .warn{fill:#fff8e8;stroke:#9a6a16;stroke-width:2;rx:10;ry:10}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:17px;fill:#1f2d3d}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;fill:#4d5b68}
      .line{stroke:#315a78;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="42" text-anchor="middle" class="text" font-size="26">ERP 报表统计优化架构</text>

  <rect x="55" y="90" width="180" height="76" class="warn"/>
  <text x="145" y="121" text-anchor="middle" class="text">统一指标口径</text>
  <text x="145" y="146" text-anchor="middle" class="small">时间 状态 金额 权限</text>

  <rect x="295" y="90" width="180" height="76" class="box"/>
  <text x="385" y="121" text-anchor="middle" class="text">交易库</text>
  <text x="385" y="146" text-anchor="middle" class="small">订单 库存 财务 单据</text>

  <rect x="535" y="90" width="180" height="76" class="box"/>
  <text x="625" y="121" text-anchor="middle" class="text">数据同步</text>
  <text x="625" y="146" text-anchor="middle" class="small">CDC MQ ETL 定时任务</text>

  <rect x="775" y="90" width="150" height="76" class="key"/>
  <text x="850" y="121" text-anchor="middle" class="text">统计库/数仓</text>
  <text x="850" y="146" text-anchor="middle" class="small">承接分析负载</text>

  <rect x="775" y="250" width="150" height="76" class="key"/>
  <text x="850" y="281" text-anchor="middle" class="text">宽表</text>
  <text x="850" y="306" text-anchor="middle" class="small">减少多表 JOIN</text>

  <rect x="535" y="250" width="180" height="76" class="key"/>
  <text x="625" y="281" text-anchor="middle" class="text">汇总表</text>
  <text x="625" y="306" text-anchor="middle" class="small">日报 月报 指标快照</text>

  <rect x="295" y="250" width="180" height="76" class="box"/>
  <text x="385" y="281" text-anchor="middle" class="text">缓存/异步导出</text>
  <text x="385" y="306" text-anchor="middle" class="small">保护页面和线程池</text>

  <rect x="55" y="250" width="180" height="76" class="warn"/>
  <text x="145" y="281" text-anchor="middle" class="text">权限预处理</text>
  <text x="145" y="306" text-anchor="middle" class="small">组织 仓库 供应商范围</text>

  <rect x="200" y="415" width="230" height="78" class="box"/>
  <text x="315" y="447" text-anchor="middle" class="text">报表页面</text>
  <text x="315" y="472" text-anchor="middle" class="small">快速查询 控制范围</text>

  <rect x="550" y="415" width="230" height="78" class="box"/>
  <text x="665" y="447" text-anchor="middle" class="text">下钻和核对</text>
  <text x="665" y="472" text-anchor="middle" class="small">汇总追溯到明细单据</text>

  <path class="line" d="M235 128 H295"/>
  <path class="line" d="M475 128 H535"/>
  <path class="line" d="M715 128 H775"/>
  <path class="line" d="M850 166 V250"/>
  <path class="line" d="M775 288 H715"/>
  <path class="line" d="M535 288 H475"/>
  <path class="line" d="M295 288 H235"/>
  <path class="line" d="M315 326 V415"/>
  <path class="line" d="M430 454 H550"/>
  <path class="line" d="M145 326 C145 380 220 415 270 415"/>
  <text x="492" y="440" class="small">用户质疑时可追溯</text>
</svg>
