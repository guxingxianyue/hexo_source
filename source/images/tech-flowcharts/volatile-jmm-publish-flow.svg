<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">volatile 可见性发布流程</title>
  <desc id="desc">管理线程写 volatile 标志，工作线程读取后感知任务停止或配置刷新。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .box { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #134e4a; }
      .sub { font-size: 13px; fill: #475569; }
      .line { stroke: #0f766e; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="50" y="95" width="160" height="75" class="box"/>
  <text x="130" y="126" text-anchor="middle" class="text">管理线程</text>
  <text x="130" y="150" text-anchor="middle" class="sub">stop / refresh</text>
  <path d="M 210 132 H 300" class="line"/>
  <rect x="315" y="95" width="160" height="75" class="box"/>
  <text x="395" y="126" text-anchor="middle" class="text">volatile 写</text>
  <text x="395" y="150" text-anchor="middle" class="sub">发布新状态</text>
  <path d="M 475 132 H 565" class="line"/>
  <rect x="580" y="95" width="160" height="75" class="box"/>
  <text x="660" y="126" text-anchor="middle" class="text">volatile 读</text>
  <text x="660" y="150" text-anchor="middle" class="sub">看到写入</text>
  <path d="M 740 132 H 825" class="line"/>
  <rect x="840" y="95" width="90" height="75" class="box"/>
  <text x="885" y="126" text-anchor="middle" class="text">工作线程</text>
  <text x="885" y="150" text-anchor="middle" class="sub">停止/切换</text>
  <rect x="250" y="255" width="460" height="70" class="warn"/>
  <text x="480" y="284" text-anchor="middle" class="text">volatile 不提供互斥</text>
  <text x="480" y="306" text-anchor="middle" class="sub">count++、多个字段一致性、可变集合修改仍需锁或原子类</text>
</svg>
