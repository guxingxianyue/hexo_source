<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">CAS 原子类和指标统计流程</title>
  <desc id="desc">CAS 通过比较旧值和新值更新内存状态，适合指标统计和配置引用，不适合替代数据库事务。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .box { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #134e4a; }
      .sub { font-size: 13px; fill: #475569; }
      .line { stroke: #0f766e; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="45" y="95" width="150" height="70" class="box"/>
  <text x="120" y="124" text-anchor="middle" class="text">读取旧值</text>
  <text x="120" y="146" text-anchor="middle" class="sub">oldValue</text>
  <path d="M 195 130 H 280" class="line"/>
  <rect x="295" y="95" width="150" height="70" class="box"/>
  <text x="370" y="124" text-anchor="middle" class="text">计算新值</text>
  <text x="370" y="146" text-anchor="middle" class="sub">newValue</text>
  <path d="M 445 130 H 530" class="line"/>
  <rect x="545" y="95" width="165" height="70" class="box"/>
  <text x="627" y="124" text-anchor="middle" class="text">CAS 更新</text>
  <text x="627" y="146" text-anchor="middle" class="sub">失败则重试</text>
  <path d="M 710 130 H 795" class="line"/>
  <rect x="810" y="95" width="125" height="70" class="box"/>
  <text x="872" y="124" text-anchor="middle" class="text">指标增长</text>
  <text x="872" y="146" text-anchor="middle" class="sub">Atomic / LongAdder</text>
  <rect x="185" y="260" width="250" height="75" class="box"/>
  <text x="310" y="290" text-anchor="middle" class="text">适合</text>
  <text x="310" y="314" text-anchor="middle" class="sub">同步成功数、接口调用数、配置引用</text>
  <rect x="545" y="260" width="250" height="75" class="warn"/>
  <text x="670" y="290" text-anchor="middle" class="text">不适合</text>
  <text x="670" y="314" text-anchor="middle" class="sub">库存扣减、单据审核、财务过账</text>
</svg>
