<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">GC 日志分析流程</title>
  <desc id="desc">展示从业务现象、GC 日志、堆变化、停顿时间到优化方案的分析流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f5d7c"/></marker>
    <style>
      .box{fill:#f7fbff;stroke:#2f5d7c;stroke-width:2;rx:10;ry:10}
      .key{fill:#eef7f0;stroke:#347a44;stroke-width:2;rx:10;ry:10}
      .warn{fill:#fff8e8;stroke:#9a6a16;stroke-width:2;rx:10;ry:10}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:17px;fill:#1f2d3d}
      .small{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:13px;fill:#4d5b68}
      .line{stroke:#2f5d7c;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="980" height="560" fill="#fff"/>
  <text x="490" y="42" text-anchor="middle" class="text" font-size="26">仓储高峰期 GC 日志分析闭环</text>
  <rect x="60" y="92" width="170" height="78" class="warn"/>
  <text x="145" y="124" text-anchor="middle" class="text">业务现象</text>
  <text x="145" y="149" text-anchor="middle" class="small">接口慢 任务堆积</text>
  <rect x="285" y="92" width="170" height="78" class="box"/>
  <text x="370" y="124" text-anchor="middle" class="text">打开 GC 日志</text>
  <text x="370" y="149" text-anchor="middle" class="small">时间 级别 标签</text>
  <rect x="510" y="92" width="170" height="78" class="box"/>
  <text x="595" y="124" text-anchor="middle" class="text">观察频率</text>
  <text x="595" y="149" text-anchor="middle" class="small">Young Full Mixed</text>
  <rect x="735" y="92" width="170" height="78" class="key"/>
  <text x="820" y="124" text-anchor="middle" class="text">判断停顿</text>
  <text x="820" y="149" text-anchor="middle" class="small">P99 STW</text>
  <rect x="735" y="265" width="170" height="78" class="box"/>
  <text x="820" y="297" text-anchor="middle" class="text">分析堆变化</text>
  <text x="820" y="322" text-anchor="middle" class="small">回收前后占用</text>
  <rect x="510" y="265" width="170" height="78" class="warn"/>
  <text x="595" y="297" text-anchor="middle" class="text">识别根因</text>
  <text x="595" y="322" text-anchor="middle" class="small">分配过快 泄漏 大对象</text>
  <rect x="285" y="265" width="170" height="78" class="key"/>
  <text x="370" y="297" text-anchor="middle" class="text">制定方案</text>
  <text x="370" y="322" text-anchor="middle" class="small">参数 代码 架构</text>
  <rect x="60" y="265" width="170" height="78" class="key"/>
  <text x="145" y="297" text-anchor="middle" class="text">压测验证</text>
  <text x="145" y="322" text-anchor="middle" class="small">吞吐 延迟 内存曲线</text>
  <rect x="315" y="435" width="350" height="70" class="box"/>
  <text x="490" y="465" text-anchor="middle" class="text">上线观察</text>
  <text x="490" y="490" text-anchor="middle" class="small">GC 次数、停顿、堆占用、订单处理耗时同步看</text>
  <path class="line" d="M230 131 H285"/>
  <path class="line" d="M455 131 H510"/>
  <path class="line" d="M680 131 H735"/>
  <path class="line" d="M820 170 V265"/>
  <path class="line" d="M735 304 H680"/>
  <path class="line" d="M510 304 H455"/>
  <path class="line" d="M285 304 H230"/>
  <path class="line" d="M145 343 C180 410 345 410 410 435"/>
  <path class="line" d="M570 435 C665 405 770 385 820 343"/>
</svg>
