<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">MySQL MVCC 和当前读流程</title>
  <desc id="desc">普通 SELECT 使用 ReadView 做快照读，UPDATE 和 SELECT FOR UPDATE 使用当前读并加锁。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
    <style>
      .box { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 8; }
      .lock { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #312e81; }
      .sub { font-size: 13px; fill: #4b5563; }
      .line { stroke: #4338ca; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="50" y="85" width="160" height="75" class="box"/>
  <text x="130" y="116" text-anchor="middle" class="text">普通 SELECT</text>
  <text x="130" y="140" text-anchor="middle" class="sub">快照读</text>
  <path d="M 210 122 H 305" class="line"/>
  <rect x="320" y="85" width="170" height="75" class="box"/>
  <text x="405" y="116" text-anchor="middle" class="text">ReadView</text>
  <text x="405" y="140" text-anchor="middle" class="sub">判断可见版本</text>
  <path d="M 490 122 H 585" class="line"/>
  <rect x="600" y="85" width="170" height="75" class="box"/>
  <text x="685" y="116" text-anchor="middle" class="text">undo log 版本</text>
  <text x="685" y="140" text-anchor="middle" class="sub">读不阻塞写</text>
  <rect x="50" y="255" width="160" height="75" class="lock"/>
  <text x="130" y="286" text-anchor="middle" class="text">UPDATE / FOR UPDATE</text>
  <text x="130" y="310" text-anchor="middle" class="sub">当前读</text>
  <path d="M 210 292 H 305" class="line"/>
  <rect x="320" y="255" width="170" height="75" class="lock"/>
  <text x="405" y="286" text-anchor="middle" class="text">读取最新版本</text>
  <text x="405" y="310" text-anchor="middle" class="sub">参与修改</text>
  <path d="M 490 292 H 585" class="line"/>
  <rect x="600" y="255" width="170" height="75" class="lock"/>
  <text x="685" y="286" text-anchor="middle" class="text">加锁更新</text>
  <text x="685" y="310" text-anchor="middle" class="sub">状态条件保护</text>
</svg>
