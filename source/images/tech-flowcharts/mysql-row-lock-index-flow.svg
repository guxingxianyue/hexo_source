<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">MySQL 行锁和索引命中流程</title>
  <desc id="desc">库存预占 SQL 命中联合唯一索引后锁住目标索引记录，未命中索引会扩大扫描和锁范围。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#365314"/>
    </marker>
    <style>
      .box { fill: #f7fee7; stroke: #365314; stroke-width: 2; rx: 8; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 8; }
      .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #24330f; }
      .sub { font-size: 13px; fill: #4b5563; }
      .line { stroke: #365314; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="50" y="75" width="160" height="75" class="box"/>
  <text x="130" y="106" text-anchor="middle" class="text">库存预占 SQL</text>
  <text x="130" y="130" text-anchor="middle" class="sub">warehouse_id + sku_id</text>
  <path d="M 210 112 H 300" class="line"/>
  <rect x="315" y="75" width="170" height="75" class="box"/>
  <text x="400" y="106" text-anchor="middle" class="text">命中联合索引</text>
  <text x="400" y="130" text-anchor="middle" class="sub">uk_wh_sku</text>
  <path d="M 485 112 H 575" class="line"/>
  <rect x="590" y="75" width="170" height="75" class="box"/>
  <text x="675" y="106" text-anchor="middle" class="text">锁目标记录</text>
  <text x="675" y="130" text-anchor="middle" class="sub">排他锁更可控</text>
  <rect x="315" y="250" width="445" height="75" class="warn"/>
  <text x="537" y="281" text-anchor="middle" class="text">未命中索引或索引不完整</text>
  <text x="537" y="305" text-anchor="middle" class="sub">扫描更多记录，锁范围扩大，容易阻塞无关 SKU 或仓库</text>
  <path d="M 400 150 V 250" class="line"/>
</svg>
