<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">项目使用 Codex 注意事项流程图</title>
  <desc id="desc">使用 Codex 前、中、后的检查流程。</desc>
  <rect width="980" height="500" fill="#f8fafc"/>
  <text x="490" y="44" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#111827">项目使用 Codex 的安全闭环</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#111827">
    <rect x="70" y="95" width="180" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="128" text-anchor="middle" font-weight="700">接入前</text>
    <text x="160" y="155" text-anchor="middle">确认权限/目录/密钥</text>
    <rect x="300" y="95" width="180" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="390" y="128" text-anchor="middle" font-weight="700">任务开始</text>
    <text x="390" y="155" text-anchor="middle">目标/上下文/约束</text>
    <rect x="530" y="95" width="180" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="620" y="128" text-anchor="middle" font-weight="700">实现中</text>
    <text x="620" y="155" text-anchor="middle">小步改动/随时看 diff</text>
    <rect x="760" y="95" width="180" height="92" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="850" y="128" text-anchor="middle" font-weight="700">验证</text>
    <text x="850" y="155" text-anchor="middle">测试/构建/手工检查</text>
    <rect x="185" y="300" width="190" height="92" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="280" y="333" text-anchor="middle" font-weight="700">审查</text>
    <text x="280" y="360" text-anchor="middle">风险代码人工 review</text>
    <rect x="430" y="300" width="190" height="92" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="525" y="333" text-anchor="middle" font-weight="700">沉淀</text>
    <text x="525" y="360" text-anchor="middle">AGENTS.md/技能/检查单</text>
    <rect x="675" y="300" width="190" height="92" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="770" y="333" text-anchor="middle" font-weight="700">发布</text>
    <text x="770" y="360" text-anchor="middle">可回滚/可追踪</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 141H300"/>
    <path d="M480 141H530"/>
    <path d="M710 141H760"/>
    <path d="M850 187C850 250 305 240 280 300"/>
    <path d="M375 346H430"/>
    <path d="M620 346H675"/>
    <path d="M525 300C500 245 555 215 620 187"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
