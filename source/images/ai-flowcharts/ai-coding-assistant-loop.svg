<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">AI编程助手协作闭环</title>
  <desc id="desc">从上下文、计划、实现、差异审查、测试验证到总结复盘的AI协作流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#3572a5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1f2d3d" flood-opacity="0.18"/>
    </filter>
    <style>
      .bg{fill:#f7fbff}
      .card{fill:#ffffff;stroke:#8db9dc;stroke-width:2;rx:12;filter:url(#shadow)}
      .title{font:700 26px Arial,"Microsoft YaHei",sans-serif;fill:#16324f}
      .label{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#16324f}
      .note{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#4b6075}
      .arrow{fill:none;stroke:#3572a5;stroke-width:3;marker-end:url(#arrow)}
      .loop{fill:none;stroke:#9bbbd4;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="980" height="520" rx="18"/>
  <text class="title" x="490" y="48" text-anchor="middle">AI编程助手不是答案机器，而是协作闭环</text>

  <rect class="card" x="70" y="100" width="190" height="92"/>
  <text class="label" x="165" y="133" text-anchor="middle">1. 给上下文</text>
  <text class="note" x="165" y="160" text-anchor="middle">现象、目标、限制</text>
  <text class="note" x="165" y="180" text-anchor="middle">相关文件和验证方式</text>

  <rect class="card" x="395" y="100" width="190" height="92"/>
  <text class="label" x="490" y="133" text-anchor="middle">2. 拆任务</text>
  <text class="note" x="490" y="160" text-anchor="middle">先读代码，再给计划</text>
  <text class="note" x="490" y="180" text-anchor="middle">把大问题切小</text>

  <rect class="card" x="720" y="100" width="190" height="92"/>
  <text class="label" x="815" y="133" text-anchor="middle">3. 实现修改</text>
  <text class="note" x="815" y="160" text-anchor="middle">按项目风格改代码</text>
  <text class="note" x="815" y="180" text-anchor="middle">保持改动范围可控</text>

  <rect class="card" x="720" y="300" width="190" height="92"/>
  <text class="label" x="815" y="333" text-anchor="middle">4. 看diff</text>
  <text class="note" x="815" y="360" text-anchor="middle">检查无关改动</text>
  <text class="note" x="815" y="380" text-anchor="middle">警惕过度抽象</text>

  <rect class="card" x="395" y="300" width="190" height="92"/>
  <text class="label" x="490" y="333" text-anchor="middle">5. 跑测试</text>
  <text class="note" x="490" y="360" text-anchor="middle">构建、单测、页面</text>
  <text class="note" x="490" y="380" text-anchor="middle">用结果代替自信</text>

  <rect class="card" x="70" y="300" width="190" height="92"/>
  <text class="label" x="165" y="333" text-anchor="middle">6. 总结复盘</text>
  <text class="note" x="165" y="360" text-anchor="middle">改了什么、验证什么</text>
  <text class="note" x="165" y="380" text-anchor="middle">风险和下一步</text>

  <path class="arrow" d="M260 146 H385"/>
  <path class="arrow" d="M585 146 H710"/>
  <path class="arrow" d="M815 192 V290"/>
  <path class="arrow" d="M720 346 H595"/>
  <path class="arrow" d="M395 346 H270"/>
  <path class="loop" d="M165 300 C95 250 95 210 165 195"/>

  <text class="note" x="490" y="454" text-anchor="middle">核心原则：AI负责加速阅读、初稿和验证，人负责边界、判断和最后确认。</text>
</svg>
