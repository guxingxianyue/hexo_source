<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
  <title id="title">Pi供应链补货Agent执行流程</title>
  <desc id="desc">展示补货Agent从业务请求、权限校验、数据查询、确定性计算、生成建议、人工审批到受控执行和审计的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1080" height="650" fill="#f8fafc"/>
  <text x="540" y="44" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" font-weight="700" fill="#0f172a">供应链补货Agent：建议与执行分离</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#0f172a">
    <rect x="45" y="82" width="990" height="120" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="70" y="111" font-size="16" font-weight="700" fill="#0369a1">业务入口</text>
    <rect x="165" y="120" width="205" height="56" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="267" y="144" text-anchor="middle" font-size="15" font-weight="700">补货分析请求</text>
    <text x="267" y="164" text-anchor="middle" font-size="13">用户 / SKU / 仓库</text>
    <rect x="445" y="120" width="205" height="56" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="547" y="144" text-anchor="middle" font-size="15" font-weight="700">权限与参数校验</text>
    <text x="547" y="164" text-anchor="middle" font-size="13">租户 / 数据范围 / requestId</text>
    <rect x="725" y="120" width="205" height="56" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="827" y="144" text-anchor="middle" font-size="15" font-weight="700">Pi AgentSession</text>
    <text x="827" y="164" text-anchor="middle" font-size="13">规则 / Skill / 会话</text>

    <rect x="45" y="245" width="990" height="142" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="70" y="274" font-size="16" font-weight="700" fill="#047857">事实与计算</text>
    <rect x="130" y="296" width="190" height="62" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="225" y="321" text-anchor="middle" font-size="15" font-weight="700">读取业务事实</text>
    <text x="225" y="343" text-anchor="middle" font-size="13">库存 / 销量 / 在途 / 交期</text>
    <rect x="445" y="296" width="190" height="62" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="540" y="321" text-anchor="middle" font-size="15" font-weight="700">确定性计算工具</text>
    <text x="540" y="343" text-anchor="middle" font-size="13">补货点 / MOQ / 包装倍数</text>
    <rect x="760" y="296" width="190" height="62" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="855" y="321" text-anchor="middle" font-size="15" font-weight="700">模型解释风险</text>
    <text x="855" y="343" text-anchor="middle" font-size="13">证据 / 假设 / 建议数量</text>

    <rect x="45" y="430" width="990" height="150" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="70" y="459" font-size="16" font-weight="700" fill="#c2410c">审批与执行</text>
    <rect x="130" y="480" width="190" height="62" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="225" y="505" text-anchor="middle" font-size="15" font-weight="700">待审批建议</text>
    <text x="225" y="527" text-anchor="middle" font-size="13">PENDING_APPROVAL</text>
    <polygon points="540,476 650,511 540,546 430,511" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="540" y="507" text-anchor="middle" font-size="15" font-weight="700">人工批准?</text>
    <text x="540" y="528" text-anchor="middle" font-size="13">数量与证据版本</text>
    <rect x="760" y="480" width="190" height="62" rx="6" fill="#ffffff" stroke="#ea580c"/>
    <text x="855" y="505" text-anchor="middle" font-size="15" font-weight="700">业务服务受控写入</text>
    <text x="855" y="527" text-anchor="middle" font-size="13">重校验 / 建采购申请 / 审计</text>

    <rect x="395" y="600" width="290" height="34" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="540" y="622" text-anchor="middle" font-size="14" fill="#991b1b">拒绝或数据过期：返回人工处理</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M370 148H445"/>
    <path d="M650 148H725"/>
    <path d="M827 176V225C827 235 225 235 225 296"/>
    <path d="M320 327H445"/>
    <path d="M635 327H760"/>
    <path d="M855 358V410C855 420 225 420 225 480"/>
    <path d="M320 511H430"/>
    <path d="M650 511H760"/>
    <path d="M540 546V600"/>
  </g>
  <text x="685" y="499" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#047857">批准</text>
  <text x="555" y="580" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#b91c1c">拒绝</text>
</svg>
