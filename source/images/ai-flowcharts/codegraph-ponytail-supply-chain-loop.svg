<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">CodeGraph与Ponytail供应链Agent闭环</title>
  <desc id="desc">展示CodeGraph扩大代码理解范围，Ponytail缩小实现范围，再通过索引同步、双重审查和测试完成供应链开发闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1080" height="760" fill="#f8fafc"/>
  <text x="540" y="42" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" font-weight="700" fill="#0f172a">CodeGraph + Ponytail：供应链Agent开发闭环</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#0f172a">
    <rect x="390" y="72" width="300" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="540" y="101" text-anchor="middle" font-size="17" font-weight="700">1. 明确供应链需求</text>
    <text x="540" y="124" text-anchor="middle" font-size="13">业务不变量 / 权限 / 事务 / 验收条件</text>

    <rect x="80" y="190" width="390" height="152" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="275" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#6d28d9">2. CodeGraph扩大理解范围</text>
    <text x="110" y="251" font-size="14">• 找到入口、符号和持久化点</text>
    <text x="110" y="278" font-size="14">• 追踪调用者、被调用者和跨文件流程</text>
    <text x="110" y="305" font-size="14">• 评估公共方法的改动影响</text>
    <text x="110" y="329" font-size="14">• 标记Topic、反射和动态SQL等图外事实</text>

    <rect x="610" y="190" width="390" height="152" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="805" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">3. Ponytail缩小实现范围</text>
    <text x="640" y="251" font-size="14">• 判断需求是否需要现在实现</text>
    <text x="640" y="278" font-size="14">• 复用项目、标准库、平台和现有依赖</text>
    <text x="640" y="305" font-size="14">• 拒绝推测性接口、工厂、配置和依赖</text>
    <text x="640" y="329" font-size="14">• 保留安全、幂等、事务和必要测试</text>

    <rect x="390" y="386" width="300" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="540" y="417" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">4. 实施最小正确改动</text>
    <text x="540" y="443" text-anchor="middle" font-size="13">小步编辑 / 复用现有模式 / 不改无关模块</text>

    <rect x="80" y="510" width="390" height="120" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="275" y="541" text-anchor="middle" font-size="17" font-weight="700" fill="#6b21a8">5. 同步图并复查影响</text>
    <text x="110" y="572" font-size="14">• status / sync确认索引最新</text>
    <text x="110" y="598" font-size="14">• 重新检查调用者和候选回归测试</text>

    <rect x="610" y="510" width="390" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="805" y="541" text-anchor="middle" font-size="17" font-weight="700" fill="#b45309">6. 双重审查与验证</text>
    <text x="640" y="572" font-size="14">• Ponytail Review检查过度设计</text>
    <text x="640" y="598" font-size="14">• 普通Review + 固定回归 + affected测试</text>

    <rect x="250" y="679" width="580" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="540" y="711" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">结果：理解要宽，改动要窄，验证要深</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M485 142L345 190"/>
    <path d="M595 142L735 190"/>
    <path d="M470 266H610"/>
    <path d="M805 342L650 386"/>
    <path d="M430 462L315 510"/>
    <path d="M650 462L765 510"/>
    <path d="M470 570H610"/>
    <path d="M805 630L650 679"/>
    <path d="M430 679L275 630"/>
  </g>
</svg>
