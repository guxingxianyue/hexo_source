<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
  <title id="title">CodeGraph供应链代码关系图</title>
  <desc id="desc">展示供应链源码经过解析和索引形成知识图谱，再通过MCP向Agent返回调用链、源码和影响范围。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1080" height="700" fill="#f8fafc"/>
  <text x="540" y="42" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" font-weight="700" fill="#0f172a">CodeGraph：从供应链源码到Agent可查询上下文</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#0f172a">
    <rect x="38" y="75" width="1004" height="112" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="62" y="104" font-size="16" font-weight="700" fill="#0369a1">供应链项目源码</text>
    <rect x="170" y="102" width="180" height="54" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="260" y="126" text-anchor="middle" font-size="15" font-weight="700">订单服务</text>
    <text x="260" y="146" text-anchor="middle" font-size="13">取消 / 超时关单</text>
    <rect x="385" y="102" width="180" height="54" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="475" y="126" text-anchor="middle" font-size="15" font-weight="700">库存服务</text>
    <text x="475" y="146" text-anchor="middle" font-size="13">预占 / 释放 / 流水</text>
    <rect x="600" y="102" width="180" height="54" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="690" y="126" text-anchor="middle" font-size="15" font-weight="700">采购服务</text>
    <text x="690" y="146" text-anchor="middle" font-size="13">审批 / 下单 / 到货</text>
    <rect x="815" y="102" width="180" height="54" rx="6" fill="#ffffff" stroke="#0284c7"/>
    <text x="905" y="126" text-anchor="middle" font-size="15" font-weight="700">仓储服务</text>
    <text x="905" y="146" text-anchor="middle" font-size="13">入库 / 拣货 / 出库</text>

    <rect x="38" y="225" width="1004" height="185" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="62" y="255" font-size="16" font-weight="700" fill="#6b21a8">本地CodeGraph索引</text>
    <rect x="115" y="280" width="210" height="88" rx="6" fill="#ffffff" stroke="#7e22ce"/>
    <text x="220" y="307" text-anchor="middle" font-size="16" font-weight="700">解析与符号提取</text>
    <text x="220" y="332" text-anchor="middle" font-size="13">类 / 方法 / 引用 / 调用</text>
    <text x="220" y="351" text-anchor="middle" font-size="13">Java及其他受支持语言</text>
    <rect x="435" y="280" width="210" height="88" rx="6" fill="#ffffff" stroke="#7e22ce"/>
    <text x="540" y="307" text-anchor="middle" font-size="16" font-weight="700">SQLite知识图谱</text>
    <text x="540" y="332" text-anchor="middle" font-size="13">符号节点 + 关系边</text>
    <text x="540" y="351" text-anchor="middle" font-size="13">源码片段 + FTS5搜索</text>
    <rect x="755" y="280" width="210" height="88" rx="6" fill="#ffffff" stroke="#7e22ce"/>
    <text x="860" y="307" text-anchor="middle" font-size="16" font-weight="700">自动增量同步</text>
    <text x="860" y="332" text-anchor="middle" font-size="13">监听新增 / 修改 / 删除</text>
    <text x="860" y="351" text-anchor="middle" font-size="13">状态检查与过期提示</text>

    <rect x="38" y="448" width="1004" height="98" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="62" y="478" font-size="16" font-weight="700" fill="#047857">Agent查询层</text>
    <rect x="250" y="470" width="250" height="52" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="375" y="501" text-anchor="middle" font-size="15">codegraph_explore（MCP）</text>
    <rect x="580" y="470" width="250" height="52" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="705" y="501" text-anchor="middle" font-size="15">explore / impact（CLI）</text>

    <rect x="38" y="584" width="1004" height="82" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="62" y="614" font-size="16" font-weight="700" fill="#c2410c">返回给Agent的工程证据</text>
    <text x="286" y="635" text-anchor="middle" font-size="15">相关源码与行号</text>
    <text x="500" y="635" text-anchor="middle" font-size="15">入口到持久化调用链</text>
    <text x="716" y="635" text-anchor="middle" font-size="15">调用者与改动影响范围</text>
    <text x="910" y="635" text-anchor="middle" font-size="15">候选回归测试</text>
  </g>

  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M260 156V225"/>
    <path d="M475 156V225"/>
    <path d="M690 156V225"/>
    <path d="M905 156V225"/>
    <path d="M325 324H435"/>
    <path d="M645 324H755"/>
    <path d="M540 368V448"/>
    <path d="M375 522V584"/>
    <path d="M705 522V584"/>
  </g>
</svg>
