<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">openspec 匹配 Java 项目流程</title>
  <desc id="desc">展示 OPSX 从读取项目规则、识别技术栈、绑定业务模块到生成可验收 artifacts 的过程。</desc>
  <rect width="1120" height="720" fill="#f8fafc"/>
  <text x="560" y="48" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#111827">/opsx:propose：先匹配项目，再生成规格</text>
  <text x="560" y="82" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#475569">避免通用方案，强制对齐当前 Java 工程的模块、接口、数据和测试方式</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .main { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .sub { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 14px; fill: #475569; }
      .small { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #64748b; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .note { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <rect class="box" x="60" y="128" width="270" height="120"/>
  <text class="main" x="195" y="164" text-anchor="middle">1. 读取项目规则</text>
  <text class="sub" x="195" y="194" text-anchor="middle">AGENTS.md / README / pom.xml</text>
  <text class="small" x="195" y="220" text-anchor="middle">先理解团队约束和模块边界</text>

  <rect class="box" x="425" y="128" width="270" height="120"/>
  <text class="main" x="560" y="164" text-anchor="middle">2. 识别技术栈</text>
  <text class="sub" x="560" y="194" text-anchor="middle">Spring / MyBatis / JPA / MQ</text>
  <text class="small" x="560" y="220" text-anchor="middle">不引入项目没有的框架</text>

  <rect class="box" x="790" y="128" width="270" height="120"/>
  <text class="main" x="925" y="164" text-anchor="middle">3. 找同类代码</text>
  <text class="sub" x="925" y="194" text-anchor="middle">Controller / Service / Mapper / Test</text>
  <text class="small" x="925" y="220" text-anchor="middle">按已有风格设计新需求</text>

  <path class="arrow" d="M330 188 H416"/>
  <path class="arrow" d="M695 188 H781"/>

  <rect class="box" x="60" y="330" width="270" height="132"/>
  <text class="main" x="195" y="366" text-anchor="middle">4. 绑定需求影响面</text>
  <text class="sub" x="195" y="396" text-anchor="middle">接口 / 表 / 状态机 / 权限</text>
  <text class="small" x="195" y="424" text-anchor="middle">列出会被修改的真实对象</text>

  <rect class="box" x="425" y="330" width="270" height="132"/>
  <text class="main" x="560" y="366" text-anchor="middle">5. 生成 artifacts</text>
  <text class="sub" x="560" y="396" text-anchor="middle">proposal / design / tasks / specs</text>
  <text class="small" x="560" y="424" text-anchor="middle">把需求变成可验收规格</text>

  <rect class="box" x="790" y="330" width="270" height="132"/>
  <text class="main" x="925" y="366" text-anchor="middle">6. 对照项目复核</text>
  <text class="sub" x="925" y="396" text-anchor="middle">包名 / 表名 / 事务 / 测试</text>
  <text class="small" x="925" y="424" text-anchor="middle">发现不匹配就回读项目</text>

  <path class="arrow" d="M925 248 V296 C925 314 910 320 884 320 H223 C197 320 195 304 195 286 V257"/>
  <path class="arrow" d="M330 396 H416"/>
  <path class="arrow" d="M695 396 H781"/>

  <rect class="note" x="215" y="548" width="690" height="92"/>
  <text class="main" x="560" y="584" text-anchor="middle">进入编码前的检查点</text>
  <text class="sub" x="560" y="614" text-anchor="middle">spec 必须能说明：改哪些真实文件、影响哪些业务流程、如何测试和验收</text>
</svg>
