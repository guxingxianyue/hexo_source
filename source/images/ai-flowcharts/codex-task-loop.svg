<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Codex任务执行闭环</title>
  <desc id="desc">Codex从接收任务、形成计划、修改代码、运行检查、审查和迭代的闭环流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2d6cdf"/>
    </marker>
    <style>
      .bg{fill:#f8fbff}
      .box{fill:#fff;stroke:#7ea9ea;stroke-width:2;rx:12}
      .decision{fill:#fff8e9;stroke:#d2a13a;stroke-width:2}
      .title{font:700 26px Arial,"Microsoft YaHei",sans-serif;fill:#17345f}
      .label{font:700 17px Arial,"Microsoft YaHei",sans-serif;fill:#17345f}
      .note{font:14px Arial,"Microsoft YaHei",sans-serif;fill:#566a86}
      .arrow{fill:none;stroke:#2d6cdf;stroke-width:3;marker-end:url(#arrow)}
      .back{fill:none;stroke:#9b6b2e;stroke-width:2.5;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="980" height="560" rx="18"/>
  <text class="title" x="490" y="46" text-anchor="middle">把Codex当成“有验收标准的协作者”</text>

  <rect class="box" x="70" y="110" width="170" height="78"/>
  <text class="label" x="155" y="140" text-anchor="middle">任务输入</text>
  <text class="note" x="155" y="164" text-anchor="middle">问题、目标、限制</text>

  <rect class="box" x="310" y="110" width="170" height="78"/>
  <text class="label" x="395" y="140" text-anchor="middle">Codex先计划</text>
  <text class="note" x="395" y="164" text-anchor="middle">读代码，说明方案</text>

  <rect class="decision" x="560" y="103" width="150" height="92" transform="rotate(45 635 149)"/>
  <text class="label" x="635" y="143" text-anchor="middle">计划可接受？</text>
  <text class="note" x="635" y="168" text-anchor="middle">不清楚就补上下文</text>

  <rect class="box" x="760" y="110" width="170" height="78"/>
  <text class="label" x="845" y="140" text-anchor="middle">执行修改</text>
  <text class="note" x="845" y="164" text-anchor="middle">小步提交思路</text>

  <rect class="box" x="760" y="330" width="170" height="78"/>
  <text class="label" x="845" y="360" text-anchor="middle">运行检查</text>
  <text class="note" x="845" y="384" text-anchor="middle">测试、lint、构建</text>

  <rect class="decision" x="560" y="323" width="150" height="92" transform="rotate(45 635 369)"/>
  <text class="label" x="635" y="363" text-anchor="middle">通过了吗？</text>
  <text class="note" x="635" y="388" text-anchor="middle">失败则定位修复</text>

  <rect class="box" x="310" y="330" width="170" height="78"/>
  <text class="label" x="395" y="360" text-anchor="middle">人类review</text>
  <text class="note" x="395" y="384" text-anchor="middle">看diff和风险</text>

  <rect class="box" x="70" y="330" width="170" height="78"/>
  <text class="label" x="155" y="360" text-anchor="middle">合并或继续</text>
  <text class="note" x="155" y="384" text-anchor="middle">总结经验，沉淀规则</text>

  <path class="arrow" d="M240 149 H300"/>
  <path class="arrow" d="M480 149 H548"/>
  <path class="arrow" d="M700 149 H750"/>
  <path class="arrow" d="M845 188 V320"/>
  <path class="arrow" d="M760 369 H722"/>
  <path class="arrow" d="M548 369 H490"/>
  <path class="arrow" d="M310 369 H250"/>
  <path class="back" d="M635 323 C610 260 520 230 395 188"/>
  <path class="back" d="M395 330 C445 260 520 235 635 195"/>
</svg>
