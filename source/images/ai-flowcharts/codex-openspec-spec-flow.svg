<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title desc">
  <title id="title">openspec 让 Spec Coding 更准确</title>
  <desc id="desc">展示 openspec skill 从需求澄清到规格说明再到实现检查的流程。</desc>
  <rect width="1080" height="580" fill="#f8fafc"/>
  <text x="540" y="44" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#111827">/openspec：先把需求变成可验收规格</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#111827">
    <rect x="70" y="105" width="180" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="137" text-anchor="middle" font-weight="700">业务需求</text>
    <text x="160" y="163" text-anchor="middle">订单/库存/结算</text>
    <rect x="300" y="105" width="180" height="86" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="137" text-anchor="middle" font-weight="700">澄清问题</text>
    <text x="390" y="163" text-anchor="middle">边界/异常/兼容</text>
    <rect x="530" y="105" width="180" height="86" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="620" y="137" text-anchor="middle" font-weight="700">Spec 文档</text>
    <text x="620" y="163" text-anchor="middle">API/DB/流程/验收</text>
    <rect x="760" y="105" width="180" height="86" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <text x="850" y="137" text-anchor="middle" font-weight="700">编码计划</text>
    <text x="850" y="163" text-anchor="middle">文件清单/步骤/测试</text>
    <rect x="250" y="315" width="210" height="92" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="355" y="349" text-anchor="middle" font-weight="700">实现</text>
    <text x="355" y="376" text-anchor="middle">按 spec 小步改动</text>
    <rect x="620" y="315" width="210" height="92" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="725" y="349" text-anchor="middle" font-weight="700">验收</text>
    <text x="725" y="376" text-anchor="middle">逐条对照 done when</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 148H300"/><path d="M480 148H530"/><path d="M710 148H760"/>
    <path d="M850 191C790 270 450 260 355 315"/>
    <path d="M460 361H620"/>
    <path d="M725 315C690 250 665 220 620 191"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
</svg>
